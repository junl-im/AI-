<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SoriON AI</title>
  <desc id="desc">Dark navy voice waveform emblem with silver and violet circular rings.</desc>
  <defs>
    <radialGradient id="bg" cx="42%" cy="34%" r="78%">
      <stop offset="0" stop-color="#172441"/>
      <stop offset="0.58" stop-color="#080f21"/>
      <stop offset="1" stop-color="#030714"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.48" stop-color="#bac6d8"/>
      <stop offset="1" stop-color="#6f7d94"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cd8ff"/>
      <stop offset="0.55" stop-color="#786cff"/>
      <stop offset="1" stop-color="#b26cff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000713" flood-opacity=".75"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#14203a" stroke-width="34" opacity=".92"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#26344e" stroke-width="8" opacity=".78"/>
  <path d="M96 265A162 162 0 0 1 249 96" fill="none" stroke="url(#silver)" stroke-width="14" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M261 96A162 162 0 0 1 414 239" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M415 252A162 162 0 0 1 285 413" fill="none" stroke="url(#silver)" stroke-width="13" stroke-linecap="round"/>
  <path d="M270 416A162 162 0 0 1 99 281" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="116" fill="#071022" stroke="#22314c" stroke-width="6"/>
  <g fill="url(#silver)" filter="url(#glow)">
    <rect x="164" y="238" width="14" height="36" rx="7"/>
    <rect x="187" y="214" width="14" height="84" rx="7"/>
    <rect x="210" y="184" width="14" height="144" rx="7"/>
    <rect x="233" y="218" width="14" height="76" rx="7"/>
    <rect x="256" y="164" width="14" height="184" rx="7"/>
    <rect x="279" y="198" width="14" height="116" rx="7"/>
    <rect x="302" y="228" width="14" height="56" rx="7"/>
    <rect x="325" y="244" width="14" height="24" rx="7"/>
  </g>
  <g fill="url(#accent)" opacity=".96">
    <rect x="210" y="184" width="14" height="50" rx="7"/>
    <rect x="256" y="164" width="14" height="56" rx="7"/>
    <rect x="279" y="198" width="14" height="34" rx="7"/>
  </g>
</svg>
