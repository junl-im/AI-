name: SoriON CI & Pages

on:
  workflow_dispatch:
    inputs:
      generate_lockfiles:
        description: Force regeneration of all npm and uv lockfiles
        required: false
        default: false
        type: boolean
      runtime_soak_minutes:
        description: Optional API·Worker soak duration
        required: true
        default: 'off'
        type: choice
        options: ['off', '5', '30', '60']
  schedule:
    - cron: '15 18 * * 0'
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: >-
    sorion-${{ github.workflow }}-${{ github.event_name }}-${{
    github.event_name == 'workflow_dispatch' && inputs.runtime_soak_minutes ||
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule' &&
    !(github.event_name == 'workflow_dispatch' && inputs.runtime_soak_minutes != 'off') }}
env:
  SORION_NODE_VERSION: '22.18.0'
  SORION_UV_VERSION: '0.11.32'

jobs:
  preflight:
    name: Repository preflight · no dependency install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Run all repository preflight checks
        id: checks
        continue-on-error: true
        run: npm run quality:preflight
      - name: Upload repository preflight report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sorion-repository-preflight-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .sorion/ci-report
      - name: Fail after preserving preflight evidence
        if: steps.checks.outcome == 'failure'
        run: exit 1

  npm_lock:
    name: npm lock · generate or verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Initialize npm lock diagnostics
        shell: bash
        run: |
          mkdir -p .sorion/lock-audit/npm
          printf '%s\n' 'npm lock job initialized' > .sorion/lock-audit/npm/status.txt
      - name: Detect npm lock mode
        id: mode
        shell: bash
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_lockfiles == true }}
        run: |
          if [[ "$FORCE_REFRESH" == "true" ]]; then
            echo 'mode=generate' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f package-lock.json ]]; then
            echo '::error title=Committed npm lock required::package-lock.json이 없습니다. workflow_dispatch의 generate_lockfiles로 생성한 뒤 검토하여 커밋하세요.'
            exit 1
          fi
          npm run locks:check -- --component npm | tee .sorion/lock-audit/npm/lock-structure-check.log
          echo 'mode=verify' >> "$GITHUB_OUTPUT"
      - name: Record npm registry diagnostics
        if: steps.mode.outputs.mode == 'generate'
        shell: bash
        run: |
          mkdir -p .sorion/lock-audit/npm
          {
            echo "registry=$(npm config get registry)"
            echo "proxy=$(npm config get proxy)"
            echo "https-proxy=$(npm config get https-proxy)"
            getent hosts registry.npmjs.org || true
            curl --silent --show-error --location --head --max-time 15 https://registry.npmjs.org/react || true
            curl --silent --show-error --location --head --max-time 15 https://registry.npmjs.com/react || true
            curl --silent --show-error --location --head --max-time 15 https://registry.yarnpkg.com/react || true
          } 2>&1 | tee .sorion/lock-audit/npm/registry-diagnostics.log
      - name: Restore npm registry cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm
          key: sorion-npm-${{ runner.os }}-node-22.18.0-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            sorion-npm-${{ runner.os }}-node-22.18.0-
      - name: Generate npm lock with bounded retry
        id: generate
        if: steps.mode.outputs.mode == 'generate'
        continue-on-error: true
        run: npm run locks:refresh:npm
      - name: Verify committed npm lock and install
        if: steps.mode.outputs.mode == 'verify'
        run: |
          npm run locks:check -- --component npm
          npm run deps:ci
      - name: Save npm cache, including partial downloads
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.npm
          key: sorion-npm-${{ runner.os }}-node-22.18.0-${{ hashFiles('package-lock.json', 'package.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload npm diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sorion-npm-lock-diagnostics
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .sorion/lock-audit/npm
      - name: Fail after preserving npm evidence
        if: steps.mode.outputs.mode == 'generate' && steps.generate.outcome == 'failure'
        run: |
          echo 'npm registry 연결 또는 의존성 해석이 실패했습니다.'
          echo '진단 artifact와 부분 cache를 보존했습니다. registry-probe.json과 package-lock-online 로그를 확인하세요.'
          find .sorion/lock-audit/npm -maxdepth 1 -type f -print -exec tail -n 30 {} \; || true
          exit 1
      - name: Validate installed web toolchain
        run: |
          npm run quality:web-toolchain
          npm run quality:dependency-tree
          npm run locks:check -- --component npm
      - name: Write npm lock proof
        run: node scripts/write-lock-proof.mjs npm
      - name: Upload verified npm lock
        uses: actions/upload-artifact@v6
        with:
          name: sorion-npm-lock
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            package-lock.json
            .sorion/lock-proof/npm.json

  api_lock:
    name: API uv lock · generate or verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          working-directory: services/api
          enable-cache: true
      - name: Initialize API lock diagnostics
        shell: bash
        run: |
          mkdir -p .sorion/lock-audit/api
          printf '%s\n' 'api lock job initialized' > .sorion/lock-audit/api/status.txt
      - name: Detect API lock mode
        id: mode
        shell: bash
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_lockfiles == true }}
        run: |
          if [[ "$FORCE_REFRESH" == "true" || ! -f services/api/uv.lock ]]; then echo 'mode=generate' >> "$GITHUB_OUTPUT"; else echo 'mode=verify' >> "$GITHUB_OUTPUT"; fi
      - name: Generate API uv lock with bounded retry
        id: generate
        if: steps.mode.outputs.mode == 'generate'
        continue-on-error: true
        run: npm run locks:refresh:api
      - name: Verify committed API lock
        if: steps.mode.outputs.mode == 'verify'
        working-directory: services/api
        run: |
          uv lock --check
          uv sync --locked --dev --python 3.10
      - name: Upload API lock diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sorion-api-lock-diagnostics
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .sorion/lock-audit/api
      - name: Fail after preserving API lock evidence
        if: steps.mode.outputs.mode == 'generate' && steps.generate.outcome == 'failure'
        run: exit 1
      - run: npm run locks:check -- --component api
      - run: node scripts/write-lock-proof.mjs api
      - uses: actions/upload-artifact@v6
        with:
          name: sorion-api-lock
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            services/api/uv.lock
            .sorion/lock-proof/api.json

  worker_lock:
    name: Worker uv lock · generate or verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          working-directory: services/worker
          enable-cache: true
      - name: Initialize Worker lock diagnostics
        shell: bash
        run: |
          mkdir -p .sorion/lock-audit/worker
          printf '%s\n' 'worker lock job initialized' > .sorion/lock-audit/worker/status.txt
      - name: Detect Worker lock mode
        id: mode
        shell: bash
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_lockfiles == true }}
        run: |
          if [[ "$FORCE_REFRESH" == "true" || ! -f services/worker/uv.lock ]]; then echo 'mode=generate' >> "$GITHUB_OUTPUT"; else echo 'mode=verify' >> "$GITHUB_OUTPUT"; fi
      - name: Generate Worker uv lock with bounded retry
        id: generate
        if: steps.mode.outputs.mode == 'generate'
        continue-on-error: true
        run: npm run locks:refresh:worker
      - name: Verify committed Worker lock
        if: steps.mode.outputs.mode == 'verify'
        working-directory: services/worker
        run: |
          uv lock --check
          uv sync --locked --dev --python 3.10
      - name: Upload Worker lock diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sorion-worker-lock-diagnostics
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .sorion/lock-audit/worker
      - name: Fail after preserving Worker lock evidence
        if: steps.mode.outputs.mode == 'generate' && steps.generate.outcome == 'failure'
        run: exit 1
      - run: npm run locks:check -- --component worker
      - run: node scripts/write-lock-proof.mjs worker
      - uses: actions/upload-artifact@v6
        with:
          name: sorion-worker-lock
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            services/worker/uv.lock
            .sorion/lock-proof/worker.json

  web:
    name: Web quality
    needs: [preflight, npm_lock]
    if: ${{ always() && needs.preflight.result == 'success' && needs.npm_lock.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: sorion-npm-lock
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: node scripts/verify-lock-proof.mjs npm
      - run: npm run locks:check -- --component npm
      - run: npm run deps:ci
      - name: Run reproducible Web quality
        id: web_quality
        continue-on-error: true
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run quality:web-repro
      - name: Verify Web quality report
        if: steps.web_quality.outcome == 'success'
        run: npm run quality:web-report:verify
      - name: Upload Web quality evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sorion-web-quality-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: .sorion/web-quality
      - name: Fail after preserving Web evidence
        if: steps.web_quality.outcome == 'failure'
        run: exit 1
      - name: Write empty static-host runtime configuration
        run: npm run runtime:config
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  api:
    name: API quality · Python 3.10
    needs: [preflight, api_lock]
    if: ${{ always() && needs.api_lock.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: sorion-api-lock
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Verify API lock proof
        working-directory: .
        run: node scripts/verify-lock-proof.mjs api
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          working-directory: services/api
          enable-cache: true
      - run: uv sync --locked --dev --python 3.10
      - name: Ruff
        run: uv run --locked --python 3.10 ruff check app tests --output-format=github
      - name: Run API tests
        run: uv run --locked --python 3.10 pytest tests -q

  worker:
    name: CosyVoice Worker quality · Python 3.10
    needs: [preflight, worker_lock]
    if: ${{ always() && needs.worker_lock.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: sorion-worker-lock
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Verify Worker lock proof
        working-directory: .
        run: node scripts/verify-lock-proof.mjs worker
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          working-directory: services/worker
          enable-cache: true
      - run: uv sync --locked --dev --python 3.10
      - name: Ruff
        run: uv run --locked --python 3.10 ruff check app tests --output-format=github
      - name: Run Worker tests
        run: uv run --locked --python 3.10 pytest tests -q


  runtime_soak:
    name: API·Worker runtime soak
    if: >-
      ${{ github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.runtime_soak_minutes != 'off') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SOAK_DURATION_MINUTES: ${{ github.event_name == 'schedule' && '30' || inputs.runtime_soak_minutes }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          enable-cache: true
      - name: Restore previous runtime soak baseline
        uses: actions/cache/restore@v5
        with:
          path: .sorion/soak-history
          key: >-
            sorion-runtime-soak-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            sorion-runtime-soak-${{ runner.os }}-${{ github.ref_name }}-
            sorion-runtime-soak-${{ runner.os }}-
      - name: Install locked API and Worker environments
        run: |
          cd services/api && uv sync --locked --dev --python 3.10
          cd ../worker && uv sync --locked --dev --python 3.10
      - name: Start isolated Worker and API
        shell: bash
        run: |
          mkdir -p .sorion/soak
          (
            cd services/worker
            SORION_WORKER_REQUIRE_MODEL_MANIFEST=false \
            SORION_WORKER_OUTPUT_PATH=../../.sorion/soak/worker \
            uv run --locked uvicorn app.main:app --host 127.0.0.1 --port 8765 \
              > ../../.sorion/soak/worker.log 2>&1 &
            echo $! > ../../.sorion/soak/worker.pid
          )
          (
            cd services/api
            SORION_COSYVOICE_WORKER_URL=http://127.0.0.1:8765 \
            SORION_JOB_STORE_PATH=../../.sorion/soak/jobs.sqlite3 \
            SORION_AUDIO_DIRECTORY=../../.sorion/soak/audio \
            SORION_VOICE_REVIEW_WRITER_LEASE_PATH=../../.sorion/soak/writer.sqlite3 \
            uv run --locked uvicorn app.main:app --host 127.0.0.1 --port 8000 \
              > ../../.sorion/soak/api.log 2>&1 &
            echo $! > ../../.sorion/soak/api.pid
          )
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Runtime services did not become healthy.' >&2
          exit 1
      - name: Schedule Worker restart recovery drill
        working-directory: services/api
        shell: bash
        run: |
          uv run --locked python scripts/run_worker_recovery_drill.py \
            --pid-file ../../.sorion/soak/worker.pid \
            --worker-directory ../worker \
            --delay-seconds 20 \
            --timeout-seconds 45 \
            --output ../../.sorion/soak/recovery-events.json \
            --log ../../.sorion/soak/worker-recovery.log \
            > ../../.sorion/soak/recovery-drill.log 2>&1 &
          echo $! > ../../.sorion/soak/recovery-drill.pid
      - name: Run API and Worker soak
        id: runtime-soak
        working-directory: services/api
        run: |
          uv run --locked python scripts/run_runtime_soak.py \
            --duration-minutes "$SOAK_DURATION_MINUTES" \
            --interval-seconds 10 \
            --api-url http://127.0.0.1:8000 \
            --worker-url http://127.0.0.1:8765 \
            --baseline-report ../../.sorion/soak-history/latest.json \
            --recovery-events ../../.sorion/soak/recovery-events.json \
            --history-output ../../.sorion/soak-history/latest.json \
            --output ../../.sorion/soak/runtime-soak.json
      - name: Wait for recovery drill evidence
        if: always()
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            [[ -f .sorion/soak/recovery-events.json ]] && exit 0
            sleep 1
          done
          echo 'Worker recovery drill evidence was not created.' >&2
          exit 1
      - name: Stop runtime services
        if: always()
        shell: bash
        run: |
          for file in .sorion/soak/api.pid .sorion/soak/worker.pid; do
            if [[ -f "$file" ]]; then
              kill "$(cat "$file")" 2>/dev/null || true
            fi
          done
      - name: Save runtime soak baseline
        if: steps.runtime-soak.outcome == 'success' && hashFiles('.sorion/soak-history/latest.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .sorion/soak-history
          key: >-
            sorion-runtime-soak-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload runtime soak evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sorion-runtime-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sorion/soak
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy GitHub Pages
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.preflight.result == 'success' && needs.web.result == 'success' &&
      needs.api.result == 'success' && needs.worker.result == 'success' }}
    needs: [preflight, web, api, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
