name: SoriON CI & Pages

on:
  workflow_dispatch:
    inputs:
      generate_lockfiles:
        description: Generate, audit, and validate npm and uv lockfiles
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: sorion-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lockfiles:
    name: Lockfiles · generate or verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Generate verified lockfiles
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_lockfiles == true }}
        run: npm run locks:refresh

      - name: Require committed lockfiles
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.generate_lockfiles != true }}
        run: |
          npm run locks:check
          (cd services/api && uv lock --check)
          (cd services/worker && uv lock --check)

      - name: Upload verified lockfiles and audit logs
        uses: actions/upload-artifact@v4
        with:
          name: sorion-verified-lockfiles
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
          path: |
            package-lock.json
            services/api/uv.lock
            services/worker/uv.lock
            .sorion/lock-audit

  web:
    name: Web quality
    needs: lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download verified lockfiles
        uses: actions/download-artifact@v4
        with:
          name: sorion-verified-lockfiles
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          package-manager-cache: false

      - name: Check web toolchain manifest
        run: npm run quality:web-manifest

      - name: Require verified lockfiles
        run: npm run locks:check

      - name: Install web dependencies from lock
        run: npm ci --no-audit --no-fund

      - name: Check installed web toolchain
        run: npm run quality:web-toolchain

      - name: Validate full dependency tree
        run: npm run quality:dependency-tree

      - name: Check project rules
        run: npm run quality:rules

      - name: Check free-only boundary
        run: npm run quality:free-only

      - name: Check engine blueprint
        run: npm run quality:engine-blueprint

      - name: Check model onboarding
        run: npm run quality:model-onboarding

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Write empty static-host runtime configuration
        run: npm run runtime:config

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  api:
    name: API quality · Python 3.10
    needs: lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download verified lockfiles
        uses: actions/download-artifact@v4
        with:
          name: sorion-verified-lockfiles
          path: .

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          working-directory: services/api
          enable-cache: true

      - name: Confirm Python version
        run: python -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"

      - name: Install API dependencies from lock
        run: uv sync --locked --dev --python 3.10

      - name: Ruff
        run: uv run --locked --python 3.10 ruff check app tests --output-format=github

      - name: Run API tests
        run: uv run --locked --python 3.10 pytest tests -q

  worker:
    name: CosyVoice Worker quality · Python 3.10
    needs: lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download verified lockfiles
        uses: actions/download-artifact@v4
        with:
          name: sorion-verified-lockfiles
          path: .

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          working-directory: services/worker
          enable-cache: true

      - name: Install Worker dependencies from lock
        run: uv sync --locked --dev --python 3.10

      - name: Ruff
        run: uv run --locked --python 3.10 ruff check app tests --output-format=github

      - name: Run Worker tests
        run: uv run --locked --python 3.10 pytest tests -q

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - web
      - api
      - worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
